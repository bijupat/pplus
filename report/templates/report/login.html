{% extends "report/layout.html" %}

{% block body %}

    <h2>Login</h2>

    {% if message %}
        <div>{{ message }}</div>
    {% endif %}

    <form action="{% url 'report:login' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <input autofocus class="form-control" type="text" name="username" placeholder="UserName">
        </div>
        <div class="form-group">
            <select class="form-control" name="dbname">
                <option value="medilab">Medilab</option>
                <option value="raqt">Raqt</option>
            </select>
        </div>
        <div class="form-group">
            <input class="form-control" type="password" name="password" placeholder="Password">
        </div>
        <input class="btn btn-primary" type="submit" value="Login">
    </form>


{% endblock %}
